<form method="post" class="form" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field">
    <span>Username</span>
    <input name="username" value="{{ form.get('username', '') }}" autocomplete="username"
           pattern="[A-Za-z0-9_.\-]{3,30}" required autofocus>
    <small>3–30 letters, numbers, dots, dashes or underscores.</small>
  </label>
  <label class="field">
    <span>Email</span>
    <input type="email" name="email" value="{{ form.get('email', '') }}" autocomplete="email" required>
  </label>
  <div class="field-row">
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
    </label>
    <label class="field">
      <span>Confirm password</span>
      <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
    </label>
  </div>
  <button class="btn btn-primary btn-block" type="submit">{{ submit_label }}</button>
</form>
