{% extends "auth/_layout.html" %}
{% block title %}Log in · Finance Journal{% endblock %}
{% block heading %}Welcome back{% endblock %}
{% block sub %}Log in to open your journal.{% endblock %}
{% block form %}
<form method="post" class="form" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field">
    <span>Username or email</span>
    <input name="login" value="{{ form.get('login', '') }}" autocomplete="username" required autofocus>
  </label>
  <label class="field">
    <span>Password</span>
    <input type="password" name="password" autocomplete="current-password" required>
  </label>
  <button class="btn btn-primary btn-block" type="submit">Log in</button>
</form>
<p class="auth-alt">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
{% endblock %}
